<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omni IA Support - usuário</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="usuario.css">
    <link rel="stylesheet" href="index.html">
</head>
<body>

    <header class="site-header">

        <!-- Logo + nome (coluna da esquerda) -->
        <a href="index.html" class="logo-container" aria-label="Omni IA Support - página inicial">
            <img src="logo.png" alt="Omni IA Support logo" class="logo-img">
            <div class="nome-logo">
                <strong>Omni IA</strong>
                <span>SUPPORT &amp; ACESSIBILIDADE</span>
            </div>
        </a>

        <!-- Menu (coluna do meio) -->
        <nav class="container" aria-label="Menu principal">

            <a href="index.html" class="nav-btn"><i class="fa-solid fa-house" aria-hidden="true"></i>
            <strong>Home</strong>
            </a>

            <a href="dashboard.html" class="nav-btn"><i class="fa-solid fa-chart-line" aria-hidden="true"></i>
            <strong>Dashboard</strong>
            </a>

            <a href="chat.html" class="nav-btn"><i class="fa-solid fa-comments" aria-hidden="true"></i>
            <strong>Chat</strong>
            </a>

            <a href="traduzir.html" class="nav-btn"><i class="fa-solid fa-hands-asl-interpreting" aria-hidden="true"></i>
            <strong>Traduzir</strong>
            </a>

            <a href="#" class="nav-btn"><i class="fa-solid fa-headset" aria-hidden="true"></i>
            <strong>Ajuda</strong>
            </a>

        </nav>

        <!-- Login / usuário (coluna da direita) -->
        <a href="usuario.html" class="user-pill" aria-label="Perfil de João Silva, usuário surdo" aria-current="page">
            <span class="avatar" aria-hidden="true">JS</span>
            <span class="user-info">
                <strong class="user-name">João Silva</strong>
                <small class="user-role">Usuário Surdo</small>
            </span>
        </a>

    </header>
</body>
</html>
